[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capitalizator"
version = "0.1.0"
description = "Private futures desk: zone, book, BTC veto. Own account only. No averaging."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "pyarrow>=16,<23",
    "duckdb>=1.1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6,<7",
]
# Exchange gateway (signer/recorder only; the desk never imports it).
# bybit-exchange/pybit — official Bybit v5 HTTP + WebSocket connector.
live = [
    "pybit>=5.17,<6",
    "websocket-client>=1.8,<2",
]
# Wilder RSI etalon. Needs the TA-Lib C library. B falls back to in-repo Wilder.
talib = [
    "numpy>=1.26,<3",
    "TA-Lib>=0.4.32,<1",
]
# Model train only. Contour A (desk/exec/jury/…) must not import these.
hyexec = [
    "xgboost>=2.1,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "river>=0.21,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"capitalizator.fusion" = ["dashboard.html"]
"capitalizator.ops" = ["chronos.html", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Russian operator texts (labels, hints) are long human sentences.
"src/capitalizator/ops/i18n_ru.py" = ["E501"]
"src/capitalizator/ops/settings.py" = ["E501"]
"src/capitalizator/ops/settings_page.py" = ["E501"]
"src/capitalizator/ops/ops_page.py" = ["E501"]
"src/capitalizator/ops/desk_chrome.py" = ["E501"]
"src/capitalizator/ops/touch_screen.py" = ["E501"]
"src/capitalizator/ops/gen_status.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Strict scope = the sessions release modules. Legacy packages are added file by file
# (CI runs `mypy` on exactly this list; see .github/workflows/lint.yml).
files = [
    "src/capitalizator/risk/sessions.py",
    "src/capitalizator/risk/correlation.py",
    "src/capitalizator/champion/calibrate.py",
    "src/capitalizator/recorder/ticker_fields.py",
    "src/capitalizator/screener/refresh.py",
    "src/capitalizator/exec/smart_stop.py",
    "src/capitalizator/gateway/keys.py",
    "src/capitalizator/ops/uptime.py",
    "src/capitalizator/ops/healthz.py",
    "src/capitalizator/ops/alerts.py",
    "src/capitalizator/ops/ops_page.py",
]
