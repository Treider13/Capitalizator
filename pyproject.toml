[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capitalizator"
version = "0.1.0"
description = "Private futures desk: zone, book, BTC veto. Own account only. No averaging."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "pyarrow>=16,<23",
    "duckdb>=1.1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]
# Exchange gateway (signer/recorder only; the desk never imports it).
# bybit-exchange/pybit — official Bybit v5 HTTP + WebSocket connector.
live = [
    "pybit>=5.17,<6",
]
# Wilder RSI etalon. Needs the TA-Lib C library. B falls back to in-repo Wilder.
talib = [
    "numpy>=1.26,<3",
    "TA-Lib>=0.4.32,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"capitalizator.ops" = ["chronos.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Russian operator texts (labels, hints) are long human sentences.
"src/capitalizator/ops/i18n_ru.py" = ["E501"]
"src/capitalizator/ops/settings.py" = ["E501"]
"src/capitalizator/ops/settings_page.py" = ["E501"]
