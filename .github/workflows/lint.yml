name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,live]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (strict scope from pyproject)
        run: mypy
      - name: Tests
        run: pytest
      - name: No keys in src
        run: |
          if grep -R -n -E 'BYBIT_API_KEY|API_SECRET|AKIA[0-9A-Z]{16}' src; then
            echo "secret-like string in src" >&2
            exit 1
          fi
      - name: No stubs in src
        run: |
          if grep -R -n -E 'TODO|FIXME|XXX|NotImplementedError|^\s*pass\s*#\s*stub' src; then
            echo "stub / placeholder marker in src" >&2
            exit 1
          fi
