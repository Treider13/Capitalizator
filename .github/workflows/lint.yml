name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest
      - name: No keys in src
        run: |
          if grep -R -n -E 'BYBIT_API_KEY|API_SECRET|AKIA[0-9A-Z]{16}' src; then
            echo "secret-like string in src" >&2
            exit 1
          fi
