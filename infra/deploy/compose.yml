# Atlas runtime on one VPS. One account writer; Demo and Live credentials are separate.
# Console binds to 127.0.0.1 — reach it through an SSH tunnel, never from the internet.
#   ssh -L 8082:127.0.0.1:8082 trader@<vps>   →   http://127.0.0.1:8082
name: capitalizator

x-base: &base
  build:
    context: ../..
    dockerfile: infra/deploy/Dockerfile
    args:
      CAP_UID: ${CAP_UID:-1000}
      CAP_GID: ${CAP_GID:-1000}
  image: capitalizator:local
  # Same uid/gid as the host owner of the data directory (deploy.sh exports them).
  user: "${CAP_UID:-1000}:${CAP_GID:-1000}"
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  # Least privilege: no capabilities, no privilege escalation, immutable image FS
  # (only /data and a tmpfs /tmp are writable).
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  volumes:
    - ${CAP_DATA:-/srv/capitalizator/userdir}:/data
  environment:
    TZ: UTC
    PYTHONDONTWRITEBYTECODE: "1"
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    CAP_USERDIR: /data
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }
  healthcheck:
    test: ["CMD", "python", "-c", "import capitalizator"]
    interval: 60s
    timeout: 10s
    retries: 3

services:
  fusion:
    <<: *base
    network_mode: host
    env_file:
      - path: ./.env
        required: false
    command: ["python", "-m", "capitalizator.fusion", "--userdir", "/data/fusion"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/api/status', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
